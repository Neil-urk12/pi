[package]
name = "rpi-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core types and traits for the pi coding agent Rust port"

[features]
test-utils = []

[dependencies]
# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# UUID
uuid = { workspace = true }

# Chrono
chrono = { workspace = true }

# Async streams
futures = { workspace = true }

# Token estimation
tiktoken-rs = { workspace = true }

# File system
dirs = { workspace = true }

# Async traits
async-trait = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
[lints.rust]
# Deny missing docs for library crate
missing_docs = "warn"
