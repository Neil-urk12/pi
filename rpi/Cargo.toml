[workspace]
resolver = "2"
members = [
    "crates/rpi-core",
    "crates/rpi-ai",
    "crates/rpi-tools",
    "crates/rpi-tui",
    "crates/rpi-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/earendil-works/pi-mono"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }

# CLI
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
pulldown-cmark = "0.12"
unicode-width = "0.2"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async streams
futures = "0.3"
tokio-stream = "0.1"
async-stream = "0.3"
async-trait = "0.1"

# UUID
uuid = { version = "1", features = ["v4"] }

# Chrono
chrono = { version = "0.4", features = ["serde"] }

# Regex
regex = "1"
tiktoken-rs = "0.11.0"

# File system
dirs = "6"
walkdir = "2"
glob = "0.3"
tempfile = "3"

# Process
which = "7"

# Internal crates
rpi-core = { path = "crates/rpi-core" }
rpi-ai = { path = "crates/rpi-ai" }
rpi-tools = { path = "crates/rpi-tools" }
rpi-tui = { path = "crates/rpi-tui" }
